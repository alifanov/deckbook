# Прод-деплой в Coolify. Postgres здесь нет — он уже поднят рядом,
# его адрес приходит переменной DATABASE_URL.
services:
  # Одноразовый контейнер: накатывает миграции и завершается. Приложение
  # стартует только после его успеха, так что запросы никогда не приходят
  # в базу со старой схемой. Единственное место, где схема меняется.
  migrate:
    build: .
    restart: "no"
    # ВРЕМЕННО, снять следующим коммитом: прод-база создана прежним db push
    # и не знает о миграциях. Размечаем её первой миграцией — она описывает
    # ровно ту схему, что в базе уже лежит (ADR-0005). `|| true` — потому что
    # на второй раз разметка уже есть и команда законно падает.
    entrypoint:
      - sh
      - -c
      - "./node_modules/.bin/prisma migrate resolve --applied 20260801000000_init || true; ./node_modules/.bin/prisma migrate deploy"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # ponytail: домен и роутинг проставляет сам Coolify по этой переменной
      SERVICE_FQDN_APP_3000:
      DATABASE_URL: ${DATABASE_URL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3000
    expose:
      - 3000
    healthcheck:
      # ponytail: /login отдаёт 200 и не ходит в базу — проверяем, что Next поднялся
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
