services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deckbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deckbook}
      POSTGRES_DB: deckbook
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deckbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://deckbook:${POSTGRES_PASSWORD:-deckbook}@db:5432/deckbook
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db:
